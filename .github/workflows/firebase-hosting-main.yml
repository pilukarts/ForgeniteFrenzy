# Legacy Firebase deployment retained for reference.
# Automatic pushes are disabled because this workflow targets the obsolete
# forgeite-frenzy project while the recovered game is published with GitHub Pages.

name: Manual legacy Firebase deployment

on:
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FORGEITE_FRENZY }}'
          projectId: forgeite-frenzy
          channelId: live
